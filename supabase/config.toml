project_id = "author-platform"
[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
[db]
port = 56322
shadow_port = 56320
major_version = 17
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 56324
[storage]
enabled = true
file_size_limit = "20MiB"
[storage.buckets.manuscripts]
public = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/zugang", "http://localhost:3000/passwort"]
enable_signup = false
jwt_expiry = 3600
[auth.email]
enabled = true
enable_confirmations = true
[edge_runtime]
enabled = false
[analytics]
enabled = false
[auth.email.template.invite]
subject = "Dein privater Zugang zum Autorenstudio"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "Autorenstudio: Passwort zurücksetzen"
content_path = "./supabase/templates/recovery.html"
