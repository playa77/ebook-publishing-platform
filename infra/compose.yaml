name: ebook-phase-a-canonical
services:
  provider-fake:
    image: node@sha256:add5c17c14752c54d2f3d519ec46a3815684d41c33f198bcb09fb998f7dcbf68
    working_dir: /app
    command: ["node", "node_modules/tsx/dist/cli.mjs", "tests/support/provider-server.ts"]
    environment:
      LOCAL_FAKE_ONLY: "1"
      FAKE_BIND_HOST: 0.0.0.0
      FAKE_DATA_DIR: /data
      FAKE_CONTROL_TOKEN: ${FAKE_CONTROL_TOKEN:?}
      FAKE_PUBLIC_ORIGIN: http://127.0.0.1:4400
      PORT: "4400"
    ports: ["127.0.0.1:4400:4400"]
    volumes: ["../:/app:ro", "provider-data:/data"]
    networks: [local]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  backup-fake:
    image: node@sha256:add5c17c14752c54d2f3d519ec46a3815684d41c33f198bcb09fb998f7dcbf68
    working_dir: /app
    command: ["node", "node_modules/tsx/dist/cli.mjs", "tests/support/backup-server.ts"]
    environment:
      LOCAL_FAKE_ONLY: "1"
      FAKE_BIND_HOST: 0.0.0.0
      FAKE_DATA_DIR: /data
      PORT: "4401"
    ports: ["127.0.0.1:4401:4401"]
    volumes: ["../:/app:ro", "backup-data:/data"]
    networks: [local]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4401/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
networks:
  local:
    external: true
    name: ebook_phase_a_local
volumes:
  provider-data:
  backup-data:
